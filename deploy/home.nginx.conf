server {
    listen 80;
    server_name home.47.237.109.221.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name home.47.237.109.221.sslip.io;
    ssl_certificate /usr/local/openresty/nginx/conf/conf.d/secure/letsencrypt/live/home.47.237.109.221.sslip.io/fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/conf.d/secure/letsencrypt/live/home.47.237.109.221.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    root /www/personal-website;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
